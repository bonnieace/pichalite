[package]
name = "pichalite"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
default-run = "pichalite"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["process"]
process = ["rivium-host/process"]
jni = ["dep:rivium-jni", "dep:jni"]

[dependencies]
apalis = { version = "=1.0.0", features = ["retry", "task-context"] }
apalis-sqlite = { version = "=1.0.0", default-features = false, features = ["migrate", "json"] }
rivium = { version = "=0.2.0", features = ["rt"] }
rivium-host = "=0.2.0"
rivium-jni = { version = "=0.2.0", optional = true }
jni = { version = "=0.21.1", optional = true, default-features = false }
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "=0.4.3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "pichalite"
path = "src/main.rs"
required-features = ["process"]

[profile.release]
codegen-units = 1
