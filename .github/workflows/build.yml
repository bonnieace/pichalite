name: PichaLite checks and APK
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo build --locked --all-features
      - run: python3 -m pip install Pillow
      - run: python3 scripts/smoke.py
      - name: JVM lifecycle and JNI contracts
        run: |
          mkdir -p target/jvm
          javac -d target/jvm android/app/src/main/java/ke/co/pichalite/{PichaRuntime,NativeJobs}.java scripts/JniSmoke.java
          TOKIO_WORKER_THREADS=1 java -Xcheck:jni -Djava.library.path=target/debug -cp target/jvm JniSmoke target/jni-smoke
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Keep preview signing consistent between builds
        id: preview-signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/pichalite-preview04.keystore
          key: pichalite-preview04-debug-signing-v1
      - name: Ensure explicit preview signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/pichalite-preview04.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/pichalite-preview04.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PichaLite Preview, O=PichaLite, C=KE"
          fi
      - name: Retain preview key before builds or tests can be interrupted
        if: steps.preview-signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/pichalite-preview04.keystore
          key: pichalite-preview04-debug-signing-v1
      - uses: gradle/actions/setup-gradle@v4
      - run: bash scripts/build-android.sh arm64-v8a x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: PichaLite-0.5.0-preview-ARM64-APK
          path: android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          retention-days: 3
      - name: Allow emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          working-directory: android
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest || { adb logcat -d -t 500; exit 1; }
            mkdir -p app/build/reports/ui
            adb pull /sdcard/Android/data/ke.co.pichalite.preview04/files/ui/. app/build/reports/ui/ || true
            adb pull /sdcard/Android/data/ke.co.pichalite.preview04/files/wrapped-preview/. app/build/reports/ui/wrapped/ || true
            adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb shell am start -n ke.co.pichalite.preview04/ke.co.pichalite.MainActivity
            sleep 3
            adb exec-out screencap -p > app/build/reports/ui/studio.png
      - name: Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/ui/
          if-no-files-found: ignore
          retention-days: 3

