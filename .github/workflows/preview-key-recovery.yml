name: Recover prior preview signing identity
on:
  pull_request:
permissions:
  contents: read
jobs:
  recover:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    steps:
      - name: Restore existing preview identity only
        id: prior
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/pichalite-preview04.keystore
          key: pichalite-preview04-debug-signing-v1
          fail-on-cache-miss: true
      - name: Encrypt identity to the temporary recovery certificate
        env:
          RECOVERY_CERT: 
        run: |
          test -f "$HOME/.android/pichalite-preview04.keystore"
          printf '%s' "$RECOVERY_CERT" | base64 --decode > "$RUNNER_TEMP/recovery-public.pem"
          openssl cms -encrypt -binary -aes256 -in "$HOME/.android/pichalite-preview04.keystore" -out "$RUNNER_TEMP/pichalite-preview04.keystore.p7m" -outform DER "$RUNNER_TEMP/recovery-public.pem"
          keytool -list -v -keystore "$HOME/.android/pichalite-preview04.keystore" -storepass android -alias androiddebugkey
      - uses: actions/upload-artifact@v4
        with:
          name: PichaLite-preview-signing-encrypted-recovery
          path: ${{ runner.temp }}/pichalite-preview04.keystore.p7m
          retention-days: 1
