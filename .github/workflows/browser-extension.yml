name: Browser extension preview
on:
  pull_request:
    paths: ['browser-extension/**', '.github/workflows/browser-extension.yml']
  push:
    branches: [main, feature/google-photos-extension]
    paths: ['browser-extension/**', '.github/workflows/browser-extension.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: PichaLite-Google-Photos-preview
          path: browser-extension/dist/*.zip
          retention-days: 7
