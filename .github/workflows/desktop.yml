name: PichaLite Windows desktop and VS Code
on:
  push:
    branches: [feature/desktop-vscode]
    paths: ['clients/**', '.github/workflows/desktop.yml', 'src/**', 'Cargo.toml']
  pull_request:
    paths: ['clients/**', '.github/workflows/desktop.yml', 'src/**', 'Cargo.toml']
  workflow_dispatch:
concurrency:
  group: desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            clients/native -> target
            clients/desktop/src-tauri -> target
      - name: Native format, lint and real image tests
        run: |
          cargo fmt --manifest-path clients/native/Cargo.toml --check
          cargo clippy --manifest-path clients/native/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path clients/native/Cargo.toml --locked
          cargo build --manifest-path clients/native/Cargo.toml --release --locked
          python scripts/client-smoke.py clients/native/target/release/pichalite-cli.exe
      - name: Desktop checks
        working-directory: clients/desktop
        run: |
          npm ci
          npm run check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          npm run build -- -- --locked
      - name: Verify packaged desktop WebView starts
        shell: pwsh
        run: |
          $app = Start-Process -FilePath clients/desktop/src-tauri/target/release/pichalite-desktop.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(45000)) { Stop-Process -Id $app.Id -Force; throw 'Desktop startup timed out' }
          if ($app.ExitCode -ne 0) { throw "Desktop WebView startup failed: $($app.ExitCode)" }
      - name: Build extension with bundled native engine
        env:
          PICHA_TEST_CLI: ${{ github.workspace }}/clients/native/target/release/pichalite-cli.exe
        working-directory: clients/vscode
        run: |
          cp ../native/target/release/pichalite-cli.exe bin/pichalite-cli.exe
          npm ci
          npm run check
          npm test
          npm run package
          python ../../scripts/check-vsix.py PichaLite-0.1.0-win32-x64.vsix
      - name: Upload installable previews
        uses: actions/upload-artifact@v4
        with:
          name: PichaLite-Windows-and-VSCode
          retention-days: 3
          if-no-files-found: error
          path: |
            clients/native/target/release/pichalite-cli.exe
            clients/desktop/src-tauri/target/release/pichalite-desktop.exe
            clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
            clients/vscode/*.vsix
      - name: Record checksums
        shell: pwsh
        run: |
          Get-ChildItem clients/native/target/release/pichalite-cli.exe,clients/desktop/src-tauri/target/release/pichalite-desktop.exe,clients/desktop/src-tauri/target/release/bundle/nsis/*.exe,clients/vscode/*.vsix | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
